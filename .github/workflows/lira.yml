name: Atualizar LIRAa

on:
  schedule:
    # Horários em UTC. Ponta Porã/MS = UTC−4 (sem horário de verão).
    # 07:00 UTC = 03:00 (madrugada), 16:00 UTC = 12:00 (almoço) e
    # 19:30 UTC = 15:30 (tarde), horário local.
    # Dias 3 a 15 de novembro. O cron não tem "ano": o scraper confere a
    # janela real (03/11/2026 a 15/11/2026) com --respeitar-janela, então
    # em novembro de 2027 em diante nada é coletado.
    - cron: '0 7,16 3-15 11 *'
    - cron: '30 19 3-15 11 *'
  workflow_dispatch:          # execução manual pela aba Actions (ignora a janela)
    inputs:
      alvo:
        description: 'Forçar a coleta de um levantamento (ex.: 288-289 para Janeiro). Deixe vazio para o comportamento normal.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: lira-dashboard
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar scraper (coleta os dados do eVisita)
        id: scraper
        env:
          LIRA_USUARIO: ${{ secrets.LIRA_USUARIO }}
          LIRA_SENHA: ${{ secrets.LIRA_SENHA }}
          # Execução agendada respeita a janela 03/11–15/11/2026; manual não.
          ARGS_JANELA: ${{ github.event_name == 'schedule' && '--respeitar-janela' || '' }}
          ALVO_FORCADO: ${{ github.event.inputs.alvo }}
          # Força o Selenium Manager a escolher o ChromeDriver certo (evita mismatch)
          SE_SKIP_DRIVER_IN_PATH: "true"
        run: |
          if [ -n "$ALVO_FORCADO" ]; then
            python lira_scraper.py --alvo "$ALVO_FORCADO"
          else
            python lira_scraper.py $ARGS_JANELA
          fi

      - name: Upload evidências da falha de login (se houver)
        if: ${{ always() && steps.scraper.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: login-falha
          path: |
            evidencias_login/login_falha.html
            evidencias_login/login_falha.txt
          if-no-files-found: ignore

      - name: Gerar dados do site
        run: python generate_dashboard.py

      - name: Publicar mudanças no repositório
        run: |
          git config user.name "lira-bot"
          git config user.email "lira-bot@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "Nada novo para commitar"
          else
            git commit -m "Atualização automática LIRAa $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
