<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIRAa — Prefeitura Municipal de Ponta Porã</title>
<meta name="description" content="Levantamento Rápido de Índices para Aedes aegypti (LIRAa) de Ponta Porã: IIP, IB, classificação de risco e histórico.">
<link rel="icon" href="assets/logo_pmpp.png">
<link rel="stylesheet" href="assets/css/lira.css">
</head>
<body>
<div id="site-header"></div>

<main class="container" id="conteudo">
  <div id="avisoFallback"></div>
  <section id="destaque" aria-live="polite"></section>

  <section class="secao">
    <div class="secao-titulo"><h2>Evolução do IIP</h2><a class="link-mais" style="margin:0" href="dashboard.html">Abrir o dashboard completo</a></div>
    <div class="grid g-3">
      <div class="card span-2">
        <div class="chart-wrap"><canvas id="gEvolucao" role="img" aria-label="Evolução do IIP nos levantamentos"></canvas></div>
      </div>
      <div class="card" id="boxVariacao"></div>
    </div>
  </section>

  <section class="secao">
    <div class="secao-titulo"><h2>Por estrato</h2><p id="subEstratos"></p></div>
    <div class="grid g-4" id="cardsEstratos"></div>
  </section>

  <section class="secao">
    <div class="grid g-2">
      <div class="card">
        <h3 class="card-titulo">Bairros com maior IIP</h3>
        <p class="card-sub" id="subRanking"></p>
        <div id="ranking"></div>
        <a class="link-mais" href="dashboard.html#ranking">Ver ranking completo</a>
      </div>
      <div class="card">
        <h3 class="card-titulo">Principais criadouros</h3>
        <p class="card-sub">Tipos de depósito com Aedes aegypti, do mais ao menos frequente.</p>
        <div id="criadouros"></div>
        <a class="link-mais" href="dashboard.html#criadouros">Ver histórico por tipo</a>
      </div>
    </div>
  </section>

  <section class="secao">
    <div class="secao-titulo"><h2>Levantamentos</h2><p>Abra um para ver o detalhe por estrato e bairro.</p></div>
    <div class="card flush"><div class="lista-lev" id="listaLev"></div></div>
  </section>

  <div id="avisoAusentes" class="secao"></div>
</main>

<div id="site-footer"></div>

<script src="assets/data/lira-data.js"></script>
<script src="assets/vendor/chart.umd.min.js"></script>
<script src="assets/js/lira-core.js"></script>
<script src="assets/js/lira-widgets.js"></script>
<script src="assets/js/home.js"></script>
</body>
</html>
